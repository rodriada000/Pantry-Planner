<div class="grid mt-4 mr-2">
  <input class="col-11" placeholder="Search Recipes..." pInputText type="text" [(ngModel)]="searchText" (keydown)="searchKeyPress($event)"/>
  <button class="ml-2" (click)="doSearch()" pButton type="button" icon="pi pi-search" iconPos="left"></button>

  <div class="col-12">
    @for (i of results; track i; let index = $index) {
      <div [style]="{'margin-top': '1em', 'padding-bottom': '0', 'padding-top': '0'}" class="">
        <div class="grid pb-1" style="background-color: var(--surface-a);" (click)="viewRecipe(i);">
          <div class="col-12">{{i.name}}</div>
          <div class="pl-3">{{i.description}}</div>
        </div>
      </div>
    }

    @if (results.length === 0) {
      <span>No records to display</span>
    }
  </div>
</div>
